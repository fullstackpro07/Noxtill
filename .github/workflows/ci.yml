name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: noxtill_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h localhost -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: mysql://root:root@localhost:3306/noxtill_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-secret-do-not-reuse-in-prod-please-32c
      JWT_REFRESH_SECRET: ci-only-refresh-secret-do-not-reuse-32chars
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 7d
      LOGIN_MAX_ATTEMPTS: 5
      LOGIN_LOCK_MINUTES: 15
      PORT: 5000
      CORS_ALLOWLIST: http://localhost:3000
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Prisma migrate + generate
        run: |
          npx prisma migrate deploy
          npx prisma generate

      - name: Lint (no auto-fix in CI)
        run: npx eslint "{src,apps,libs,test}/**/*.ts"

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: e2e tests (real signup -> sale -> nightly-close -> review-request journey)
        run: npm run test:e2e

      - name: Backup + restore drill
        run: bash scripts/backup-restore-drill.sh
        env:
          MYSQL_HOST: localhost
          MYSQL_PORT: 3306
          MYSQL_USER: root
          MYSQL_PASSWORD: root
          MYSQL_DATABASE: noxtill_test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
